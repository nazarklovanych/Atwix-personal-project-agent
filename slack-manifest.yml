display_information:
  name: Personal Project Agent
  description: Read-only investigation agent — mention it to troubleshoot issues
  background_color: "#2D9EE0"
features:
  bot_user:
    display_name: ppa
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
